pattern = "(?<!\\w)(?:silence|tension)\\s+(?:that\\s+)?(?:could|you\\s+could)\\s+(?:cut|be\\s+cut)\\s+with\\s+a\\s+knife(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)(?:silence|tension)\\s+(?:stretches?|hangs?|falls?)(?:\\s+between)?(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)(?:in\\s+one\\s+(?:smooth|fluid)\\s+motion|with\\s+practiced\\s+ease)(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)(?:moved?\\s+with\\s+practiced\\s+(?:efficiency|precision)|(?:her|his|their|my|your)\\s+motions?\\s+(?:were|was)\\s+economical)(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)(?:dances\\s+on\\s+the\\s+edge|teeters\\s+on\\s+the\\s+brink|walks\\s+a\\s+fine\\s+line|razor['’]s\\s+edge|precipice\\s+of|maelstrom\\s+of|whirlwind\\s+of)(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)motes?\\s+of\\s+dust\\s+(?:dancing|floating|caught)(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)sunlight\\s+filtered\\s+through(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)liquid\\s+(?:gold|silver|fire|amber|shadows)(?!\\w)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)(?:labyrinth|maze)\\s+of\\s+(?:the\\s+mind|memories|thoughts|shadows)(?!\\w)"

# ---------------------------------------------------------
# NEGATION PIVOTS
# ---------------------------------------------------------

[[phrase]]
category = "negation_pivots"
pattern = "[.;]\\s+(?i:instead),\\s+[^.!?\\n]{1,50}[.!?]"

[[phrase]]
category = "negation_pivots"
pattern = "(?i)(?<!\\w)(?:not|(?:wasn['’]t|weren['’]t|isn['’]t|aren['’]t|didn['’]t|doesn['’]t|don['’]t))\\s+(?:only|just|merely|simply|really|exactly)\\s+[^.!?\\n,;]{1,50},?\\s+but\\s+(?:rather\\s+)?[^.!?\\n]{1,80}(?:[.!?…]|$)"

[[phrase]]
category = "metaphor_slop"
pattern = "(?<!\\w)leaves?\\s+little\\s+to\\s+the\\s+imagination(?!\\w)"

# ---------------------------------------------------------
# FANTASY SLOP
# ---------------------------------------------------------

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)ethereal\\s+(?:form|figure|presence|being|voice|light|mist)(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)ancient\\s+(?:wisdom|power|presence)(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)eyes\\s+glow(?:ed|ing)?\\s+with\\s+(?:an?\\s+)?(?:eerie|otherworldly|unnatural|magical)\\s+light(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)(?:melodic|musical|silken)\\s+voice(?:\\s+echo(?:ed|ing)?\\s+in\\s+(?:her|his|their|my|your)\\s+mind)?(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)(?:shimmering|smoky)\\s+mist(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)you\\s+have\\s+summoned\\s+me,\\s+mortal(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)(?:the\\s+)?entity\\s+(?:intoned|mused|sighed|studied)(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)(?:a\\s+)?worthy\\s+wish(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)walk\\s+the\\s+path\\s+of(?!\\w)"

[[phrase]]
category = "fantasy_slop"
pattern = "(?<!\\w)shimmering\\s+appendage(?!\\w)"
